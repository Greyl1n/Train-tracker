<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Tracker Finland | Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #0d1117; --text: #e6edf3; --accent: #ffa500; --glass: rgba(22, 27, 34, 0.85); --border: rgba(255, 255, 255, 0.1); }
    body, html, #map { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    #sidebar { position: absolute; top: 80px; left: 1rem; bottom: 1rem; width: 300px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
    .search-box { width: 100%; padding: 0.5rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; }
    .list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .item { padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; border: 1px solid transparent; }
    .item:hover { background: rgba(255,255,255,0.05); }
    .item.active { background: rgba(255, 165, 0, 0.15); border-color: var(--accent); }
    .title { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
    .task-badge { font-size: 0.7rem; color: #58a6ff; background: rgba(56, 139, 253, 0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; margin: 2px 2px 0 0; }
    .domain-badge { font-size: 0.65rem; color: #8b949e; background: rgba(139, 148, 158, 0.15); padding: 2px 6px; border-radius: 12px; float: right; }
    .marker-badge { font-size: 1.2rem; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
    .marker-badge { font-size: 1.2rem; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
    .leaflet-popup-content-wrapper { background: var(--glass); color: white; backdrop-filter: blur(10px); border: 1px solid var(--border); }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #8b949e; font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    
    /* Stats Panel */
    #stats-panel { display: none; flex: 1; overflow-y: auto; padding: 1rem; }
    #stats-panel.active { display: block; }
    .stat-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .stat-title { font-size: 0.75rem; color: #8b949e; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    
    /* Loading Bar Styles */
    .loader-container { display: flex; align-items: center; gap: 8px; }
    .loading-bar { width: 60px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: relative; display: none; }
    .loading-bar-fill { width: 100%; height: 100%; background: var(--accent); position: absolute; left: -100%; transition: left 0.3s ease; }
    .loading-bar.active { display: block; }
    .loading-bar.active .loading-bar-fill { animation: loading-sweep 1.5s infinite linear; }
    @keyframes loading-sweep {
      0% { left: -100%; }
      50% { left: 0; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700; font-size:1.2rem;">Road Tracker Finland</div>
    <div class="loader-container">
      <div id="loader" class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div id="status" style="color:#ffa500; font-size:0.9rem;">● Live</div>
    </div>
  </header>
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('list')">Live List</div>
      <div class="tab" onclick="switchTab('stats')">Statistics</div>
    </div>
    
    <div id="list-panel" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      <div class="sidebar-header"><input type="text" id="search" class="search-box" placeholder="Search tasks..."></div>
      <div id="list" class="list"></div>
    </div>

    <div id="stats-panel">
      <div class="stat-box">
        <div class="stat-title">Total Active Vehicles</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Top Tasks</div>
        <div id="stat-tasks" style="font-size:0.85rem; line-height:1.5;"></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Domains</div>
        <div id="stat-domains" style="font-size:0.85rem; line-height:1.5;"></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Active Vehicles Over Time</div>
        <canvas id="historyChart" width="200" height="150"></canvas>
      </div>
    </div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const map = L.map("map", { zoomControl: false }).setView([64.5, 26.0], 5);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const loader = document.getElementById("loader");
    function showLoading() { loader.classList.add("active"); }
    function hideLoading() { setTimeout(() => loader.classList.remove("active"), 1000); }

    const socket = io();
    const markers = {}, listItems = {};
    const listEl = document.getElementById("list");
    let query = "";

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('list-panel').style.display = tabId === 'list' ? 'flex' : 'none';
      document.getElementById('stats-panel').classList.toggle('active', tabId === 'stats');
    }

    const ctx = document.getElementById('historyChart').getContext('2d');
    const historyChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Vehicles', data: [], borderColor: '#ffa500', backgroundColor: 'rgba(255, 165, 0, 0.1)', fill: true, tension: 0.3 }] },
      options: { 
        responsive: true, 
        plugins: { legend: { display: false } },
        scales: { 
          x: { ticks: { color: '#8b949e', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
        }
      }
    });

    socket.on("road_statistics", (stats) => {
      document.getElementById("stat-total").textContent = stats.total;
      
      const tasksEl = document.getElementById("stat-tasks");
      tasksEl.innerHTML = Object.entries(stats.tasks).map(([k, v]) => `<div><b style="color:var(--accent);text-transform:capitalize;">${k}</b>: ${v}</div>`).join('');
      
      const domainsEl = document.getElementById("stat-domains");
      domainsEl.innerHTML = Object.entries(stats.domains).map(([k, v]) => `<div><b style="color:var(--accent);text-transform:capitalize;">${k}</b>: ${v}</div>`).join('');

      historyChart.data.labels = stats.history.times;
      historyChart.data.datasets[0].data = stats.history.counts;
      historyChart.update();
    });

    socket.on("road_locations", (vehicles) => {
      showLoading();
      const ids = new Set();
      vehicles.forEach(v => {
        const id = String(v.id); 
        ids.add(id);
        
        if (v.lat === undefined || v.lon === undefined || v.lat === null || v.lon === null) {
          return;
        }

        const pos = [v.lat, v.lon];
        const taskStr = (v.tasks || []).join(', ') || 'Patrolling';
        const searchStr = `${taskStr} ${v.domain || ''} ${v.source || ''}`.toLowerCase();
        
        if (!markers[id]) {
          const icon = L.divIcon({ 
            className: 'custom-div-icon', 
            html: `<div class="marker-badge">🚜</div>`, 
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });
          markers[id] = L.marker(pos, { icon }).addTo(map).bindPopup(
            `<b style="color:orange">Road Maintenance</b><br/>` +
            `<b>Tasks:</b> ${taskStr}<br/>` +
            `<b>Source:</b> ${v.source || 'Unknown'}<br/>` +
            `<b>Domain:</b> ${v.domain || 'Unknown'}<br/>` +
            `<b>Direction:</b> ${v.direction !== undefined ? v.direction + '°' : 'N/A'}<br/>` +
            `<b>Time:</b> ${v.timestamp ? new Date(v.timestamp).toLocaleString() : 'N/A'}`
          );
          
          const el = document.createElement("div"); 
          el.className = "item";
          const taskBadges = (v.tasks || []).map(t => `<span class="task-badge">${t}</span>`).join('');
          el.innerHTML = `<span class="domain-badge">${v.domain || 'Unknown'}</span><div class="title">🚜 Maintenance #${id.slice(-6)}</div><div style="margin-top:4px">${taskBadges || '<span class="task-badge">Patrolling</span>'}</div>`;
          el.onclick = () => { 
            document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
            el.classList.add("active");
            map.flyTo(pos, 12); 
            markers[id].openPopup(); 
          };
          listItems[id] = { el, searchStr };
        } else { 
          markers[id].setLatLng(pos); 
        }
      });
      
      Object.keys(markers).forEach(id => { 
        if (!ids.has(id)) { 
          map.removeLayer(markers[id]); 
          delete markers[id]; 
          delete listItems[id]; 
        } 
      });
      renderList();
      hideLoading();
    });

    function renderList() {
      listEl.innerHTML = "";
      Object.values(listItems).forEach(item => { 
        if (!query || item.searchStr.includes(query)) listEl.appendChild(item.el); 
      });
    }
    document.getElementById("search").oninput = (e) => { query = e.target.value.toLowerCase(); renderList(); };
  </script>
</body>
</html>
