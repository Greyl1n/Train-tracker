<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Tracker Finland | Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #0d1117; --text: #e6edf3; --accent: #00f2ff; --dest: #ffae00; --orig: #3fb950; --glass: rgba(22, 27, 34, 0.9); --border: rgba(255, 255, 255, 0.12); }
    body, html, #map { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    #sidebar { position: absolute; top: 80px; left: 1rem; bottom: 1rem; width: 330px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
    .search-box { width: 100%; box-sizing: border-box; padding: 0.5rem 0.65rem; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; margin-bottom: 8px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filters label { font-size: 0.72rem; color: #8b949e; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .item { padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
    .item:hover { background: rgba(255,255,255,0.05); }
    .item.active { background: rgba(0, 242, 255, 0.12); border-color: var(--accent); }
    .title { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
    .speed { font-size: 0.7rem; color: #3fb950; background: rgba(46, 160, 67, 0.15); padding: 2px 6px; border-radius: 12px; float: right; }
    .route-line-text { font-size: 0.76rem; color: #c9d1d9; margin-top: 4px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .eta-badge { font-size: 0.68rem; color: var(--dest); background: rgba(255, 174, 0, 0.12); border: 1px solid rgba(255, 174, 0, 0.3); padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 5px; font-weight: 600; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #8b949e; font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    
    /* Stats Panel */
    #stats-panel { display: none; flex: 1; overflow-y: auto; padding: 1rem; }
    #stats-panel.active { display: block; }
    .stat-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .stat-title { font-size: 0.75rem; color: #8b949e; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    /* Selected Vessel & Route Info Card (Corner HUD - Never blocks ship or harbour on map) */
    #route-card {
      position: absolute;
      top: 80px;
      right: 1rem;
      z-index: 1000;
      width: 325px;
      background: var(--glass);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 242, 255, 0.4);
      border-radius: 12px;
      padding: 0.95rem 1.05rem;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      display: none;
    }
    #route-card.active { display: block; }
    .route-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.45rem; }
    .route-card-close { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 1rem; padding: 0 4px; }
    .route-card-close:hover { color: white; }
    .route-ports { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.32); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.75rem; margin: 0.5rem 0; }
    .port-box { display: flex; flex-direction: column; }
    .port-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e; }
    .port-name { font-size: 0.85rem; font-weight: 700; margin-top: 2px; }
    .port-name.orig { color: var(--orig); }
    .port-name.dest { color: var(--dest); }
    .route-eta-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; padding-top: 4px; }

    /* Non-blocking Transparent-Center Harbour Highlight Rings */
    .harbour-orig-ring {
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(63, 185, 80, 0.10);
      border: 2px solid var(--orig);
      box-shadow: 0 0 10px rgba(63, 185, 80, 0.55);
      pointer-events: none;
    }
    .harbour-dest-wrapper {
      position: relative;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .harbour-dest-pulse {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255, 174, 0, 0.18);
      border: 2px solid var(--dest);
      animation: pulse-ring 1.8s infinite ease-out;
      pointer-events: none;
    }
    .harbour-dest-ring {
      position: relative;
      z-index: 2;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255, 174, 0, 0.12);
      border: 2.5px solid var(--dest);
      box-shadow: 0 0 14px rgba(255, 174, 0, 0.85);
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 1; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    .leaflet-tooltip.harbour-label-orig {
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid var(--orig);
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      pointer-events: none;
      white-space: nowrap;
    }
    .leaflet-tooltip.harbour-label-dest {
      background: rgba(13, 17, 23, 0.92);
      border: 1.5px solid var(--dest);
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 0 14px rgba(255, 174, 0, 0.35);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Loading Bar Styles */
    .loader-container { display: flex; align-items: center; gap: 8px; }
    .loading-bar { width: 60px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: relative; display: none; }
    .loading-bar-fill { width: 100%; height: 100%; background: var(--accent); position: absolute; left: -100%; transition: left 0.3s ease; }
    .loading-bar.active { display: block; }
    .loading-bar.active .loading-bar-fill { animation: loading-sweep 1.5s infinite linear; }
    @keyframes loading-sweep {
      0% { left: -100%; }
      50% { left: 0; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700; font-size:1.2rem;">Marine Tracker Finland</div>
    <div class="loader-container">
      <div id="loader" class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div id="status" style="color:var(--accent); font-size:0.9rem;">● Live</div>
    </div>
  </header>

  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('list', event)">Live List</div>
      <div class="tab" onclick="switchTab('stats', event)">Statistics</div>
    </div>
    
    <div id="list-panel" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      <div class="sidebar-header">
        <input type="text" id="search" class="search-box" placeholder="Search vessels, harbours...">
        <div class="filters">
          <label><input type="checkbox" value="Cargo"> Cargo</label>
          <label><input type="checkbox" value="Commercial"> Comm.</label>
          <label><input type="checkbox" value="Private"> Priv.</label>
        </div>
      </div>
      <div id="list" class="list"></div>
    </div>

    <div id="stats-panel">
      <div class="stat-box">
        <div class="stat-title">Total Active Vessels</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-grid" style="margin-bottom: 1rem;">
        <div class="stat-box" style="margin-bottom:0;">
          <div class="stat-title">Avg Speed</div>
          <div class="stat-value" id="stat-avg-speed">0 <span style="font-size:0.8rem;font-weight:400;">km/h</span></div>
        </div>
        <div class="stat-box" style="margin-bottom:0;">
          <div class="stat-title">Max Speed</div>
          <div class="stat-value" id="stat-max-speed">0 <span style="font-size:0.8rem;font-weight:400;">km/h</span></div>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Categories</div>
        <div id="stat-categories" style="font-size:0.85rem; line-height:1.5;"></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Active Vessels Over Time</div>
        <canvas id="historyChart" width="200" height="150"></canvas>
      </div>
    </div>
  </div>

  <!-- Top-Right Vessel & Route HUD (Never covers the ship or harbour on the map) -->
  <div id="route-card">
    <div class="route-card-header">
      <div>
        <div id="rc-name" style="font-weight:700; color:var(--accent); font-size:1.02rem;"></div>
        <div id="rc-sub" style="font-size:0.73rem; color:#8b949e; margin-top:2px;"></div>
      </div>
      <button class="route-card-close" onclick="clearSelection()" title="Clear selection">✕</button>
    </div>
    <div class="route-ports">
      <div class="port-box">
        <span class="port-label">⚓ Departure</span>
        <span class="port-name orig" id="rc-origin">-</span>
      </div>
      <div style="color:#8b949e; font-size:1.1rem; font-weight:700;">→</div>
      <div class="port-box" style="text-align:right;">
        <span class="port-label">🎯 Destination</span>
        <span class="port-name dest" id="rc-dest">-</span>
      </div>
    </div>
    <div class="route-eta-row">
      <span style="color:#8b949e;">Estimated Arrival (ETA):</span>
      <span id="rc-eta" style="color:var(--dest); font-weight:700;">-</span>
    </div>
    <div class="route-eta-row">
      <span style="color:#8b949e;">Speed / Heading:</span>
      <span id="rc-kinematics" style="color:#3fb950; font-weight:600;">-</span>
    </div>
    <div class="route-eta-row">
      <span style="color:#8b949e;">MMSI / Last Update:</span>
      <span id="rc-meta" style="color:#c9d1d9; font-size:0.74rem;">-</span>
    </div>
  </div>

  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([60.0, 24.5], 7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const loader = document.getElementById("loader");
    function showLoading() { loader.classList.add("active"); }
    function hideLoading() { setTimeout(() => loader.classList.remove("active"), 1000); }

    const socket = io();
    let listData = [], selectedId = null;
    let query = "";

    const routeLayer = L.layerGroup().addTo(map);
    const vesselLayer = L.layerGroup().addTo(map);

    map.on('click', () => {
      if (selectedId) clearSelection();
    });

    function switchTab(tabId, ev) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (ev && ev.target) ev.target.classList.add('active');
      document.getElementById('list-panel').style.display = tabId === 'list' ? 'flex' : 'none';
      document.getElementById('stats-panel').classList.toggle('active', tabId === 'stats');
    }

    const ctx = document.getElementById('historyChart').getContext('2d');
    const historyChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Vessels', data: [], borderColor: '#00f2ff', backgroundColor: 'rgba(0, 242, 255, 0.1)', fill: true, tension: 0.3 }] },
      options: { 
        responsive: true, 
        plugins: { legend: { display: false } },
        scales: { 
          x: { ticks: { color: '#8b949e', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
        }
      }
    });

    socket.on("marine_statistics", (stats) => {
      document.getElementById("stat-total").textContent = stats.total;
      document.getElementById("stat-avg-speed").innerHTML = `${stats.avg_speed} <span style="font-size:0.8rem;font-weight:400;">km/h</span>`;
      document.getElementById("stat-max-speed").innerHTML = `${stats.max_speed} <span style="font-size:0.8rem;font-weight:400;">km/h</span>`;
      
      const catsEl = document.getElementById("stat-categories");
      catsEl.innerHTML = Object.entries(stats.categories).map(([k, v]) => `<div><b style="color:var(--accent);text-transform:capitalize;">${k}</b>: ${v}</div>`).join('');

      historyChart.data.labels = stats.history.times;
      historyChart.data.datasets[0].data = stats.history.counts;
      historyChart.update();
    });

    socket.on("marine_locations", (vessels) => {
      showLoading();
      listData = vessels;
      renderList();
      updateMap();
      hideLoading();
    });

    function updateRouteCard(v) {
      const card = document.getElementById("route-card");
      if (!v) {
        card.classList.remove("active");
        return;
      }
      card.classList.add("active");
      document.getElementById("rc-name").textContent = `🚢 ${v.name}`;
      document.getElementById("rc-sub").textContent = `${v.shipType} (${v.category}) • Call: ${v.callSign}`;
      document.getElementById("rc-origin").textContent = v.origin || "Unknown";
      document.getElementById("rc-dest").textContent = v.destination || "Unknown";
      document.getElementById("rc-eta").textContent = v.eta || "N/A";
      const headingStr = v.heading !== 'N/A' && v.heading !== undefined ? `${v.heading}°` : 'N/A';
      document.getElementById("rc-kinematics").textContent = `${Math.round(v.speed * 1.852)} km/h (${v.speed} kn) • ${headingStr}`;
      const timeStr = v.timestamp && v.timestamp !== 'N/A' ? new Date(v.timestamp).toLocaleTimeString() : 'Live';
      document.getElementById("rc-meta").textContent = `${v.mmsi} • ${timeStr}`;
    }

    function clearSelection() {
      selectedId = null;
      routeLayer.clearLayers();
      updateRouteCard(null);
      renderList();
      updateMap();
    }

    function renderSelectedVesselRoute(v) {
      routeLayer.clearLayers();
      if (!v) return;

      const trail = Array.isArray(v.route) && v.route.length >= 2
        ? v.route
        : [[v.originLat, v.originLon], [v.lat, v.lon]];

      // 1. Travelled maritime fairway route: Departure Harbour -> Fairway -> Ship
      if (trail && trail.length >= 2) {
        L.polyline(trail, {
          color: "#00f2ff",
          weight: 8,
          opacity: 0.22,
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }).addTo(routeLayer);

        L.polyline(trail, {
          color: "#00f2ff",
          weight: 3.2,
          opacity: 0.95,
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }).addTo(routeLayer);
      }

      // 2. Remaining maritime fairway course: Ship -> Destination Harbour
      const destPath = Array.isArray(v.destRoute) && v.destRoute.length >= 2
        ? v.destRoute
        : (v.destLat !== undefined ? [[v.lat, v.lon], [v.destLat, v.destLon]] : null);

      if (destPath) {
        L.polyline(destPath, {
          color: "#ffae00",
          weight: 2.2,
          opacity: 0.6,
          dashArray: "6, 8",
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }).addTo(routeLayer);
      }

      // Choose opposite horizontal label sides so departure & destination labels never collide or cover the harbour/ship
      const origIsWest = (v.originLon || 0) <= (v.destLon || 0);
      const origDir = origIsWest ? "left" : "right";
      const origOffset = origIsWest ? [-16, 0] : [16, 0];
      const destDir = origIsWest ? "right" : "left";
      const destOffset = origIsWest ? [20, 0] : [-20, 0];

      // 3. Departure Harbour Ring (Hollow & non-interactive so ships in harbour remain 100% visible and clickable)
      if (v.originLat !== undefined && v.originLon !== undefined) {
        const origIcon = L.divIcon({
          className: "",
          html: `<div class="harbour-orig-ring"></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        const origMarker = L.marker([v.originLat, v.originLon], { icon: origIcon, interactive: false });
        origMarker.bindTooltip(
          `<span style="color:#3fb950;font-weight:700;">⚓ ${v.origin}</span>`,
          { permanent: true, direction: origDir, offset: origOffset, className: "harbour-label-orig" }
        );
        routeLayer.addLayer(origMarker);
      }

      // 4. Highlighted Destination Harbour Ring + ETA (Hollow & side-labeled so harbour/ship are never covered)
      if (v.destLat !== undefined && v.destLon !== undefined) {
        const destIcon = L.divIcon({
          className: "",
          html: `
            <div class="harbour-dest-wrapper">
              <div class="harbour-dest-pulse"></div>
              <div class="harbour-dest-ring"></div>
            </div>
          `,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
        const destMarker = L.marker([v.destLat, v.destLon], { icon: destIcon, interactive: false });
        destMarker.bindTooltip(
          `<span style="color:#ffae00;font-weight:700;">🎯 ${v.destination}</span> <span style="color:#e6edf3;">• ETA: ${v.eta || 'N/A'}</span>`,
          { permanent: true, direction: destDir, offset: destOffset, className: "harbour-label-dest" }
        );
        routeLayer.addLayer(destMarker);
      }
    }

    function selectVessel(v, flyTo = false) {
      selectedId = v.mmsi;
      renderList();
      updateMap();

      if (flyTo) {
        const boundsPoints = [[v.lat, v.lon]];
        if (v.originLat !== undefined && v.originLon !== undefined) {
          boundsPoints.push([v.originLat, v.originLon]);
        }
        if (v.destLat !== undefined && v.destLon !== undefined) {
          boundsPoints.push([v.destLat, v.destLon]);
        }
        if (boundsPoints.length > 1) {
          map.flyToBounds(L.latLngBounds(boundsPoints), {
            paddingTopLeft: [360, 90],
            paddingBottomRight: [350, 60],
            maxZoom: 10,
            duration: 1.1
          });
        } else {
          map.flyTo([v.lat, v.lon], 10);
        }
      }
    }

    function updateMap() {
      vesselLayer.clearLayers();
      const activeCats = Array.from(document.querySelectorAll('.filters input:checked')).map(cb => cb.value);
      let selectedVesselObj = null;
      let selectedMarker = null;

      listData.forEach(v => {
        const matchQuery = !query ||
          v.name.toLowerCase().includes(query) ||
          (v.origin && v.origin.toLowerCase().includes(query)) ||
          (v.destination && v.destination.toLowerCase().includes(query));

        if (activeCats.length > 0 && !activeCats.includes(v.category)) return;
        if (!matchQuery) return;

        const isSelected = selectedId === v.mmsi;
        if (isSelected) selectedVesselObj = v;

        const marker = L.circleMarker([v.lat, v.lon], {
          radius: isSelected ? 7 : 3.2,
          fillColor: isSelected ? "#00f2ff" : (v.speed > 1 ? "#3fb950" : "#8b949e"),
          color: isSelected ? "#ffffff" : "none",
          weight: 2.5,
          opacity: 1,
          fillOpacity: isSelected ? 1 : 0.78
        });

        marker.on('click', (ev) => {
          L.DomEvent.stopPropagation(ev);
          selectVessel(v, false);
        });
        vesselLayer.addLayer(marker);
        if (isSelected) selectedMarker = marker;
      });

      if (selectedId && !selectedVesselObj) {
        selectedVesselObj = listData.find(v => v.mmsi === selectedId) || null;
      }

      if (selectedVesselObj) {
        renderSelectedVesselRoute(selectedVesselObj);
        updateRouteCard(selectedVesselObj);
        if (selectedMarker && selectedMarker.bringToFront) {
          selectedMarker.bringToFront();
        }
      } else {
        routeLayer.clearLayers();
        updateRouteCard(null);
      }
    }

    function renderList() {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";
      const activeCats = Array.from(document.querySelectorAll('.filters input:checked')).map(cb => cb.value);
      
      let count = 0;
      const MAX_ITEMS = 100;

      for (const v of listData) {
        const matchQuery = !query ||
          v.name.toLowerCase().includes(query) ||
          (v.origin && v.origin.toLowerCase().includes(query)) ||
          (v.destination && v.destination.toLowerCase().includes(query));

        if (activeCats.length > 0 && !activeCats.includes(v.category)) continue;
        if (!matchQuery) continue;

        count++;
        if (count > MAX_ITEMS) break;

        const el = document.createElement("div");
        el.className = `item ${selectedId === v.mmsi ? 'active' : ''}`;
        el.innerHTML = `
          <span class="speed">${Math.round(v.speed * 1.852)} km/h</span>
          <div class="title">${v.name}</div>
          <div style="font-size:0.74rem; color:#8b949e;">${v.shipType}</div>
          <div class="route-line-text">
            <span style="color:var(--orig); font-weight:600;">⚓ ${v.origin || 'Unknown'}</span>
            <span style="color:#8b949e;">→</span>
            <span style="color:var(--dest); font-weight:600;">🎯 ${v.destination || 'Unknown'}</span>
          </div>
          <div class="eta-badge">🕒 ETA: ${v.eta || 'N/A'}</div>
        `;
        el.onclick = () => selectVessel(v, true);
        listEl.appendChild(el);
      }
      
      if (count > MAX_ITEMS) {
        const more = document.createElement("div");
        more.style.cssText = "padding: 10px; text-align: center; color: #8b949e; font-size: 0.8rem;";
        more.innerText = `Showing first ${MAX_ITEMS} of ${listData.length} vessels...`;
        listEl.appendChild(more);
      }
    }

    document.getElementById("search").oninput = (e) => { 
      query = e.target.value.toLowerCase(); 
      renderList();
      updateMap();
    };
    document.querySelectorAll(".filters input").forEach(cb => cb.onchange = () => {
      renderList();
      updateMap();
    });
  </script>
</body>
</html>
