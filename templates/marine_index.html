<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Tracker Finland | Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #0d1117; --text: #e6edf3; --accent: #00f2ff; --glass: rgba(22, 27, 34, 0.85); --border: rgba(255, 255, 255, 0.1); }
    body, html, #map { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    header { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: 1rem 2rem; background: var(--glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    #sidebar { position: absolute; top: 80px; left: 1rem; bottom: 1rem; width: 320px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
    .search-box { width: 100%; padding: 0.5rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; color: white; outline: none; margin-bottom: 8px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters label { font-size: 0.7rem; color: #8b949e; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .item { padding: 0.75rem; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; border: 1px solid transparent; }
    .item:hover { background: rgba(255,255,255,0.05); }
    .item.active { background: rgba(0, 242, 255, 0.1); border-color: var(--accent); }
    .title { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
    .speed { font-size: 0.7rem; color: #3fb950; background: rgba(46, 160, 67, 0.15); padding: 2px 6px; border-radius: 12px; float: right; }
    .marker-badge { background: var(--accent); color: #0d1117; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 0.75rem; cursor: pointer; color: #8b949e; font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    
    /* Stats Panel */
    #stats-panel { display: none; flex: 1; overflow-y: auto; padding: 1rem; }
    #stats-panel.active { display: block; }
    .stat-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .stat-title { font-size: 0.75rem; color: #8b949e; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    
    /* Loading Bar Styles */
    .loader-container { display: flex; align-items: center; gap: 8px; }
    .loading-bar { width: 60px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: relative; display: none; }
    .loading-bar-fill { width: 100%; height: 100%; background: var(--accent); position: absolute; left: -100%; transition: left 0.3s ease; }
    .loading-bar.active { display: block; }
    .loading-bar.active .loading-bar-fill { animation: loading-sweep 1.5s infinite linear; }
    @keyframes loading-sweep {
      0% { left: -100%; }
      50% { left: 0; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700; font-size:1.2rem;">Marine Tracker Finland</div>
    <div class="loader-container">
      <div id="loader" class="loading-bar"><div class="loading-bar-fill"></div></div>
      <div id="status" style="color:var(--accent); font-size:0.9rem;">● Live</div>
    </div>
  </header>
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('list')">Live List</div>
      <div class="tab" onclick="switchTab('stats')">Statistics</div>
    </div>
    
    <div id="list-panel" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
      <div class="sidebar-header">
        <input type="text" id="search" class="search-box" placeholder="Search vessels...">
        <div class="filters">
          <label><input type="checkbox" value="Cargo"> Cargo</label>
          <label><input type="checkbox" value="Commercial"> Comm.</label>
          <label><input type="checkbox" value="Private"> Priv.</label>
        </div>
      </div>
      <div id="list" class="list"></div>
    </div>

    <div id="stats-panel">
      <div class="stat-box">
        <div class="stat-title">Total Active Vessels</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat-grid" style="margin-bottom: 1rem;">
        <div class="stat-box" style="margin-bottom:0;">
          <div class="stat-title">Avg Speed</div>
          <div class="stat-value" id="stat-avg-speed">0 <span style="font-size:0.8rem;font-weight:400;">km/h</span></div>
        </div>
        <div class="stat-box" style="margin-bottom:0;">
          <div class="stat-title">Max Speed</div>
          <div class="stat-value" id="stat-max-speed">0 <span style="font-size:0.8rem;font-weight:400;">km/h</span></div>
        </div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Categories</div>
        <div id="stat-categories" style="font-size:0.85rem; line-height:1.5;"></div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Active Vessels Over Time</div>
        <canvas id="historyChart" width="200" height="150"></canvas>
      </div>
    </div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const map = L.map("map", { zoomControl: false, preferCanvas: true }).setView([60.0, 24.5], 7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png").addTo(map);

    const loader = document.getElementById("loader");
    function showLoading() { loader.classList.add("active"); }
    function hideLoading() { setTimeout(() => loader.classList.remove("active"), 1000); }

    const socket = io();
    let listData = [], selectedId = null;
    let query = "";
    const vesselLayer = L.layerGroup().addTo(map);

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('list-panel').style.display = tabId === 'list' ? 'flex' : 'none';
      document.getElementById('stats-panel').classList.toggle('active', tabId === 'stats');
    }

    const ctx = document.getElementById('historyChart').getContext('2d');
    const historyChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Vessels', data: [], borderColor: '#00f2ff', backgroundColor: 'rgba(0, 242, 255, 0.1)', fill: true, tension: 0.3 }] },
      options: { 
        responsive: true, 
        plugins: { legend: { display: false } },
        scales: { 
          x: { ticks: { color: '#8b949e', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
        }
      }
    });

    socket.on("marine_statistics", (stats) => {
      document.getElementById("stat-total").textContent = stats.total;
      document.getElementById("stat-avg-speed").innerHTML = `${stats.avg_speed} <span style="font-size:0.8rem;font-weight:400;">km/h</span>`;
      document.getElementById("stat-max-speed").innerHTML = `${stats.max_speed} <span style="font-size:0.8rem;font-weight:400;">km/h</span>`;
      
      const catsEl = document.getElementById("stat-categories");
      catsEl.innerHTML = Object.entries(stats.categories).map(([k, v]) => `<div><b style="color:var(--accent);text-transform:capitalize;">${k}</b>: ${v}</div>`).join('');

      historyChart.data.labels = stats.history.times;
      historyChart.data.datasets[0].data = stats.history.counts;
      historyChart.update();
    });

    socket.on("marine_locations", (vessels) => {
      showLoading();
      listData = vessels;
      renderList();
      updateMap();
      hideLoading();
    });

    function selectVessel(v, flyTo = false) {
      selectedId = v.mmsi;
      renderList();
      updateMap();
      
      const popup = L.popup()
        .setLatLng([v.lat, v.lon])
        .setContent(`
          <div style="font-family:'Inter', sans-serif;">
            <b style="color:var(--accent); font-size:1.1rem;">${v.name}</b><br/>
            <span style="color:#8b949e; font-size:0.8rem;">Call: ${v.callSign}</span><hr style="border:0; border-top:1px solid #30363d; margin:5px 0;">
            Type: ${v.shipType}<br/>
            Speed: ${Math.round(v.speed * 1.852)} km/h<br/>
            Heading: ${v.heading !== 'N/A' && v.heading !== undefined ? v.heading + '°' : 'N/A'}<br/>
            Dest: ${v.destination}<br/>
            Time: ${v.timestamp !== 'N/A' && v.timestamp !== undefined ? new Date(v.timestamp).toLocaleString() : 'N/A'}
          </div>
        `)
        .openOn(map);

      if (flyTo) {
        map.flyTo([v.lat, v.lon], 12);
      }
    }

    function updateMap() {
      vesselLayer.clearLayers();
      const activeCats = Array.from(document.querySelectorAll('.filters input:checked')).map(cb => cb.value);
      
      listData.forEach(v => {
        if (activeCats.length > 0 && !activeCats.includes(v.category)) return;
        if (query && !v.name.toLowerCase().includes(query)) return;

        const isSelected = selectedId === v.mmsi;
        const marker = L.circleMarker([v.lat, v.lon], {
          radius: isSelected ? 6 : 2.5,
          fillColor: isSelected ? "#00f2ff" : (v.speed > 1 ? "#3fb950" : "#8b949e"),
          color: isSelected ? "#fff" : "none",
          weight: 2,
          opacity: 1,
          fillOpacity: isSelected ? 1 : 0.7
        });

        marker.on('click', () => selectVessel(v));
        vesselLayer.addLayer(marker);
      });
    }

    function renderList() {
      const listEl = document.getElementById("list");
      listEl.innerHTML = "";
      const activeCats = Array.from(document.querySelectorAll('.filters input:checked')).map(cb => cb.value);
      
      let count = 0;
      const MAX_ITEMS = 100;

      for (const v of listData) {
        if (activeCats.length > 0 && !activeCats.includes(v.category)) continue;
        if (query && !v.name.toLowerCase().includes(query)) continue;

        count++;
        if (count > MAX_ITEMS) break;

        const el = document.createElement("div");
        el.className = `item ${selectedId === v.mmsi ? 'active' : ''}`;
        el.innerHTML = `
          <span class="speed">${Math.round(v.speed * 1.852)} km/h</span>
          <div class="title">${v.name}</div>
          <div style="font-size:0.75rem; opacity:0.8;">${v.shipType}</div>
          <div style="font-size:0.7rem; color:#8b949e; margin-top:4px;">→ ${v.destination}</div>
        `;
        el.onclick = () => selectVessel(v, true);
        listEl.appendChild(el);
      }
      
      if (count > MAX_ITEMS) {
        const more = document.createElement("div");
        more.style.cssText = "padding: 10px; text-align: center; color: #8b949e; font-size: 0.8rem;";
        more.innerText = `Showing first ${MAX_ITEMS} of ${listData.length} vessels...`;
        listEl.appendChild(more);
      }
    }

    document.getElementById("search").oninput = (e) => { 
      query = e.target.value.toLowerCase(); 
      renderList();
      updateMap(); // Filter map too
    };
    document.querySelectorAll(".filters input").forEach(cb => cb.onchange = () => {
      renderList();
      updateMap();
    });
  </script>
</body>
</html>
